<style>

/* ---------- persistence ---------- */
const KEY="mrc:trailers:v1";
async function loadState(){
  try{ if(window.storage&&window.storage.get){ const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
  return null;
}
async function saveState(s){
  try{ if(window.storage&&window.storage.set){ await window.storage.set(KEY, JSON.stringify(s)); } }catch(e){}
}

/* ---------- bid-sheet parser (deterministic) ---------- */
function parseBidSheet(text){
  const rows=text.split(/\r?\n/).map(r=>r).filter(r=>r.trim().length);
  if(!rows.length) return {units:[],error:"Nothing to parse."};
  const split=r=> r.includes("\t")? r.split("\t") : r.split(/\s{2,}|,(?=\S)/);
  // find header row
  let hi=rows.findIndex(r=>/unit/i.test(r)&&/vin/i.test(r));
  if(hi<0) return {units:[],error:"Couldn't find a header row containing 'Unit' and 'Vin'."};
  const heads=split(rows[hi]).map(h=>h.trim().toLowerCase());
  const idx=(...names)=>{for(const n of names){const i=heads.findIndex(h=>h.includes(n)); if(i>=0)return i;}return -1;};
  const iUnit=idx("unit"), iVin=idx("vin"), iLoc=idx("pickup location","location"),
        iAddr=idx("address"), iCom=idx("comment"), iPrice=idx("mrc","bid","price","amount");
  const out=[];
  for(let r=hi+1;r<rows.length;r++){
    const c=split(rows[r]).map(x=>x.trim());
    if(!c.length||!(c[iUnit]||c[iVin])) continue;
    const price=iPrice>=0? parseFloat((c[iPrice]||"").replace(/[^0-9.\-]/g,"")):null;
    out.push({
      unitNumber:(c[iUnit]||"").trim(),
      vin:(c[iVin]||"").trim(),
      pickupLocationCode:iLoc>=0?(c[iLoc]||"").trim():"",
      pickupAddress:iAddr>=0?(c[iAddr]||"").trim():"",
      comments:iCom>=0?(c[iCom]||"").trim():"",
      purchasePrice:isNaN(price)?null:price,
    });
  }
  return {units:out,error:out.length?null:"Found the header but no data rows."};
}

/* ---------- AI bridge ---------- */
async function callAI(system,user){
  const combined = system + "\n\n=== USER MESSAGE ===\n" + user;
  // Prefer native artifact bridge if present
  if(window.claude && window.claude.complete){
    return await window.claude.complete(combined);
  }
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:combined}]})
  });
  const data = await res.json();
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
function extractJSON(t){
  if(!t) return null;
  let s=t.replace(/```json/gi,"```").split("```").map(x=>x.trim());
  // try each fenced block, else whole
  const cands = s.filter(Boolean).concat([t]);
  for(const c of cands){
    const a=c.indexOf("{"), b=c.lastIndexOf("}");
    if(a>=0&&b>a){ try{ return JSON.parse(c.slice(a,b+1)); }catch(e){} }
  }
  return null;
}

/* ---------- action executor ---------- */
function resolveBuyer(state,ref){
  if(!ref) return null;
  const r=(""+ref).toLowerCase();
  return state.buyers.find(b=>b.id===ref) ||
         state.buyers.find(b=>b.name.toLowerCase()===r) ||
         state.buyers.find(b=>b.name.toLowerCase().includes(r)) || null;
}
function resolveOrder(state,ref,buyerId){
  if(!ref&&buyerId) return state.orders.find(o=>o.buyerId===buyerId&&o.open);
  if(!ref) return null;
  const r=(""+ref).toLowerCase();
  return state.orders.find(o=>o.id.toLowerCase()===r) ||
         state.orders.find(o=>(o.id+" "+o.customerReference).toLowerCase().includes(r)) || null;
}
function selectUnits(state,sel){
  if(!sel) return [];
  let list=state.units.slice();
  if(sel.ids&&sel.ids.length) return list.filter(u=>sel.ids.includes(u.id));
  if(sel.unitNumbers&&sel.unitNumbers.length){
    const set=sel.unitNumbers.map(x=>(""+x).toLowerCase());
    return list.filter(u=>set.includes((u.unitNumber||"").toLowerCase())||set.includes((u.id||"").toLowerCase()));
  }
  if(sel.source) list=list.filter(u=>u.source.toLowerCase()===(""+sel.source).toLowerCase());
  if(sel.status) list=list.filter(u=>u.status===sel.status || u.status.toLowerCase().includes((""+sel.status).toLowerCase()));
  if(sel.equipmentType) list=list.filter(u=>u.equipmentType.toLowerCase().includes((""+sel.equipmentType).toLowerCase()));
  if(sel.physicalLocation) list=list.filter(u=>(u.physicalLocation||"").toLowerCase().includes((""+sel.physicalLocation).toLowerCase()));
  return list;
}
function applyActions(prev,actions){
  const state=JSON.parse(JSON.stringify(prev));
  const log=[];
  for(const a of (actions||[])){
    try{
      if(a.type==="create_buyer"){
        const b={id:"B"+Math.random().toString(36).slice(2,7),group:"Trailer Buyer",remaMember:false,notes:"",destruction:"",...a};
        delete b.type; state.buyers.push(b); log.push("Created buyer “"+b.name+"”");
      }
      else if(a.type==="update_buyer"){
        const b=resolveBuyer(state,a.buyer||a.buyerId||a.name);
        if(!b){log.push("⚠︎ Couldn't find buyer “"+(a.buyer||a.name)+"”");continue;}
        Object.keys(a).forEach(k=>{if(!["type","buyer","buyerId"].includes(k))b[k]=a[k];});
        log.push("Updated buyer “"+b.name+"”");
      }
      else if(a.type==="create_order"){
        const b=resolveBuyer(state,a.buyer||a.buyerId||a.buyerName);
        if(!b){log.push("⚠︎ Couldn't find buyer for order “"+(a.buyer||a.buyerName)+"”");continue;}
        const id="SO-"+(state.seq.so++);
        state.orders.push({id,buyerId:b.id,customerReference:a.customerReference||"",itemCode:a.itemCode||"",priceType:a.priceType||"per ton",price:a.price??null,refWeight:a.refWeight??null,headerNotes:a.headerNotes||"",detailNotes:a.detailNotes||"",createdDate:new Date().toISOString().slice(0,10),open:true});
        log.push("Created "+id+" for "+b.name+(a.customerReference?" ("+a.customerReference+")":""));
      }
      else if(a.type==="add_units"){
        const arr=a.units||[];
        arr.forEach(u=>{
          const e=EQUIP[u.equipmentType]||{};
          state.units.push({id:"W"+(state.seq.bwt++),soldToBuyerId:null,salesOrderId:null,titleStatus:u.titleStatus||"Title",comments:u.comments||"",pickupLocationCode:u.pickupLocationCode||"",pickupAddress:u.pickupAddress||"",physicalLocation:u.physicalLocation||"",purchasePrice:u.purchasePrice??null,notes:u.notes||"",refWeight:u.refWeight??e.wt??null,itemCode:u.itemCode||e.item||"",status:u.status||"Purchase — Not Ready",source:u.source||"Other",equipmentType:u.equipmentType||"Long Straight Rail",unitNumber:u.unitNumber||"",vin:u.vin||"",length:u.length||""});
        });
        log.push("Added "+arr.length+" unit"+(arr.length!==1?"s":""));
      }
      else if(a.type==="attach_units"){
        const b=resolveBuyer(state,a.buyer||a.buyerName||a.buyerId);
        const o=resolveOrder(state,a.salesOrder||a.order||a.orderId,b&&b.id);
        const units=selectUnits(state,a.units||a.select||{});
        if(!o){log.push("⚠︎ Couldn't find a sales order to attach to");continue;}
        const buyer=b||state.buyers.find(x=>x.id===o.buyerId);
        let n=0;
        units.forEach(u=>{const t=state.units.find(x=>x.id===u.id); if(t){t.salesOrderId=o.id;t.soldToBuyerId=buyer?buyer.id:t.soldToBuyerId;t.status="Sold — Dispatch Required";n++;}});
        log.push("Attached "+n+" unit"+(n!==1?"s":"")+" to "+o.id+(buyer?" ("+buyer.name+")":"")+" → Sold");
      }
      else if(a.type==="set_status"){
        const units=selectUnits(state,a.units||a.select||{});
        let n=0; units.forEach(u=>{const t=state.units.find(x=>x.id===u.id); if(t){t.status=a.status;if(a.hauler)t.notes=((t.notes?t.notes+" · ":"")+"Hauler: "+a.hauler);n++;}});
        log.push("Moved "+n+" unit"+(n!==1?"s":"")+" → "+(STATUSES.find(s=>s.key===a.status)||{short:a.status}).short);
      }
      else if(a.type==="add_note"){
        if(a.buyer||a.buyerName){const b=resolveBuyer(state,a.buyer||a.buyerName); if(b){b.notes=(b.notes?b.notes+"\n":"")+a.note; log.push("Note added to “"+b.name+"”");}}
        else {const units=selectUnits(state,a.units||a.select||{}); let n=0; units.forEach(u=>{const t=state.units.find(x=>x.id===u.id); if(t){t.notes=(t.notes?t.notes+"\n":"")+a.note;n++;}}); log.push("Note added to "+n+" unit"+(n!==1?"s":""));}
      }
      else { log.push("⚠︎ Unknown action: "+a.type); }
    }catch(e){ log.push("⚠︎ Error on "+a.type+": "+e.message); }
  }
  return {state,log};
}

/* ---------- system prompt ---------- */
function buildSystem(state){
  const buyers=state.buyers.map(b=>b.name+" [id "+b.id+", "+b.deductionModel+(b.destruction?"":" , NO destruction agmt")+"]").join("; ");
  const orders=state.orders.map(o=>{const b=state.buyers.find(x=>x.id===o.buyerId);return o.id+" ("+(b?b.name:"?")+", ref "+o.customerReference+", item "+o.itemCode+")";}).join("; ");
  const counts=STATUSES.map(s=>s.short+":"+state.units.filter(u=>u.status===s.key).length).join(", ");
  return `You are the assistant inside MRC's Trailers & Containers ops console (a scrap-metal trailer brokerage). You turn plain-English requests into structured data operations, then confirm in a friendly, concise sentence or two. MRC BUYS end-of-life trailers/containers/tractors from fleets (FedEx Ground, Walmart, Union Pacific, Hub Group, JB Hunt) and SELLS them to scrap yards (the "buyers") for destruction.

Reply with ONE JSON object only, no prose outside it:
{"reply":"<short human confirmation or answer>","actions":[ ... ]}

ACTION TYPES (include only what's needed; use [] for pure questions):
- create_buyer: {type,name,group?("Trailer Buyer"|"Freight"),billingAddress?,contactName?,contactEmail?,contactPhone?,paymentTerms?,paymentMethod?,deductionModel?("No Deductions"|"Standard"|"Variable"),standardDeductions?,destruction?(YYYY-MM-DD signed date),remaMember?(bool),mergedParent?(bool),notes?}
- update_buyer: {type,buyer:"<name or id>", ...any buyer fields to change}
- create_order: {type,buyer:"<name or id>",customerReference?(e.g."AUG 26"),itemCode?(7000-series),priceType?("per lb"|"per ton"|"flat"),price?,refWeight?,headerNotes?,detailNotes?}
- add_units: {type,units:[{unitNumber,vin,source,equipmentType,physicalLocation?,pickupLocationCode?,pickupAddress?,comments?,purchasePrice?,titleStatus?,status?}]}
- attach_units: {type,buyer?,salesOrder?:"<SO id or ref>",units:{ids?:[],unitNumbers?:[],source?,status?,equipmentType?,physicalLocation?}}  // attaching flips units to "Sold — Dispatch Required"
- set_status: {type,status:<one of the exact status strings>,hauler?,units:{...same selector...}}
- add_note: {type,note,buyer?:"<name>"}  OR  {type,note,units:{...selector...}}   // buyer notes are Kim's reference field

EXACT status strings: ${STATUSES.map(s=>'"'+s.key+'"').join(", ")}.
equipmentType options + default item codes: ${Object.entries(EQUIP).map(([k,v])=>k+"("+v.item+")").join(", ")}.

RULES: Match buyers/orders by name loosely. Never invent data the user didn't give — leave optional fields out. If a buyer has NO destruction agreement, and the user tries to attach FedEx or Walmart units to them, still do it but add a warning in "reply". Put buyer confirmation-email text or pricing memos into headerNotes/notes. For customerReference use ABBREV MONTH + 2-digit year like "AUG 26".

CURRENT DATA — buyers: ${buyers||"(none)"}. Open orders: ${orders||"(none)"}. Unit counts: ${counts}. Total units: ${state.units.length}.
Answer data questions using this snapshot in "reply" with actions:[].`;
}

function Inventory({state,statusFilter,setStatusFilter,sourceFilter,setSourceFilter,onOpen}){

  if(statusFilter) units=units.filter(u=>u.status===statusFilter);
  if(sourceFilter) units=units.filter(u=>u.source===sourceFilter);
  units.sort((a,b)=>STATUSES.findIndex(s=>s.key===a.status)-STATUSES.findIndex(s=>s.key===b.status));
  const buyerName=id=>{const b=state.buyers.find(x=>x.id===id);return b?b.name:"";};
  return <div>
    <div className="pagehead"><h2>Inventory</h2><span className="sub">{units.length} of {state.units.length} broker weight tickets</span></div>
    <div className="filters">
      <span className={"chip"+(!statusFilter?" on":"")} onClick={()=>setStatusFilter(null)}>All statuses</span>
      {STATUSES.filter(s=>state.units.some(u=>u.status===s.key)).map(s=><span key={s.key} className={"chip"+(statusFilter===s.key?" on":"")} onClick={()=>setStatusFilter(statusFilter===s.key?null:s.key)}>{s.short}</span>)}
      <span style={{width:14}}></span>

        <button className="x" onClick={close}>×</button>
      </div>
      <div className="dbody">{body}</div>
    </div>
  </div>;
}

function Assistant({state,setState}){
  const [log,setLog]=useState(state.chat&&state.chat.length?state.chat:[{role:"bot",text:"Hey — I'm your ops assistant. Tell me in plain English what you need: create a buyer, build a sales order, attach units to it, move units through the pipeline, or ask a question about what's in the system. To load a purchase list, drop it into the bid-sheet importer below.",did:null}]);
  const [input,setInput]=useState("");
  const [busy,setBusy]=useState(false);
  const [paste,setPaste]=useState("");
  const [err,setErr]=useState("");
  const endRef=useRef(null);
  useEffect(()=>{endRef.current&&endRef.current.scrollIntoView({behavior:"smooth"});},[log,busy]);

  const persistChat=(next)=>{ setState(s=>({...s,chat:next.slice(-40)})); };

  async function send(text){
    const t=(text||input).trim(); if(!t||busy) return;
    setErr(""); setInput("");
    const next=[...log,{role:"user",text:t}]; setLog(next); persistChat(next);
    setBusy(true);
    try{
      const sys=buildSystem(state);
      const raw=await callAI(sys,t);
      const parsed=extractJSON(raw);
      if(!parsed){ const n=[...next,{role:"bot",text:"I couldn't parse that into an action — try rephrasing, or be a bit more specific about the buyer/order/units."}]; setLog(n);persistChat(n); setBusy(false); return; }
      let logLines=[];
      if(parsed.actions&&parsed.actions.length){
        const {state:ns,log:ll}=applyActions(state,parsed.actions);
        logLines=ll; setState(prev=>({...ns,chat:prev.chat}));
      }
      const n=[...next,{role:"bot",text:parsed.reply||"Done.",did:logLines}];
      setLog(n); persistChat(n);
    }catch(e){
      const n=[...next,{role:"bot",text:"Something went wrong reaching the assistant model ("+e.message+"). The bid-sheet importer below still works without it."}];
      setLog(n);persistChat(n);
    }
    setBusy(false);
  }

  function runImport(){
    setErr("");
    const {units,error}=parseBidSheet(paste);
    if(error){setErr(error);return;}
    // default source guess
    const withSrc=units.map(u=>({...u,source:"Walmart",equipmentType:"Long Straight Rail",status:"Purchase — Not Ready"}));
    const {state:ns,log}=applyActions(state,[{type:"add_units",units:withSrc}]);
    setState(prev=>({...ns,chat:prev.chat}));
    const line={role:"bot",text:"Imported "+units.length+" unit"+(units.length!==1?"s":"")+" from the bid sheet as Walmart · Long Straight Rail · Purchase — Not Ready. Open Inventory to review — adjust any 45-ft all-steel units.",did:log};
    const merged=[...log,line];
    setLog(merged); persistChat(merged);
    setPaste("");
  }

  return <div className="asst">
    <div className="chatlog">
      {log.map((m,i)=><div key={i} className={"msg "+(m.role==="user"?"user":"bot")}>
        <div className="who cond">{m.role==="user"?"You":"MRC"}</div>
        <div className="bubble">
          <div style={{whiteSpace:"pre-wrap"}}>{m.text}</div>
          {m.did&&m.did.length>0&&<div className="did"><b>Done</b><ul>{m.did.map((d,j)=><li key={j}>{d}</li>)}</ul></div>}
        </div>
      </div>)}
      {busy&&<div className="msg bot"><div className="who cond">MRC</div><div className="bubble muted">working…</div></div>}
      <div ref={endRef}></div>
    </div>
    <div className="composer">
      <textarea value={input} onChange={e=>setInput(e.target.value)} placeholder="e.g. Create an AUG 26 order for SA Recycling at 17¢/lb, then attach the two Ready FedEx pups…"
        onKeyDown={e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();send();}}}/>
      <div className="row">
        <button className="btn" disabled={busy||!input.trim()} onClick={()=>send()}>Send</button>
        <span className="hint">⌘/Ctrl + Enter</span>
      </div>
      <div className="prompts">{EXAMPLES.map((p,i)=><button key={i} onClick={()=>send(p)} disabled={busy}>{p.length>52?p.slice(0,52)+"…":p}</button>)}</div>
      <details className="import">
        <summary>Import a purchase / bid sheet</summary>
        <div className="ibody">
          <p className="hint" style={{margin:"4px 0 8px"}}>Paste rows straight from Excel (tab-separated). It looks for a header with <b>Unit</b> and <b>Vin</b>, then maps Unit&nbsp;# · VIN · Pickup Location · Pickup Address · Comments · MRC(price). Imports as Walmart, Purchase — Not Ready.</p>
          <textarea value={paste} onChange={e=>setPaste(e.target.value)} placeholder={"Unit #\tVin\tPickup Location\tPickup Address\tComments\tMRC\n61457\t1PNV...\t3530\t850 W Rusk St, Rockwall, TX\tTires worn but ok\t1033"}/>
          {err&&<div className="warnrow" style={{margin:"6px 0"}}>⚠︎ {err}</div>}
          <div className="row"><button className="btn sm" disabled={!paste.trim()} onClick={runImport}>Parse &amp; add units</button></div>
        </div>
      </details>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
